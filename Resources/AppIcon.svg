<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Fondo: cristal oscuro, como el widget -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3142"/>
      <stop offset="1" stop-color="#0d1119"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Trazo del pulso: verde → amarillo → rojo (misma escala que loadColor) -->
    <linearGradient id="pulse" x1="190" y1="0" x2="834" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="300" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Placa con proporciones de icono macOS (824 px en lienzo de 1024) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#tile)">
    <!-- Cuadrícula tenue de monitor -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="3">
      <line x1="100" y1="300" x2="924" y2="300"/>
      <line x1="100" y1="440" x2="924" y2="440"/>
      <line x1="100" y1="580" x2="924" y2="580"/>
      <line x1="100" y1="720" x2="924" y2="720"/>
      <line x1="300" y1="100" x2="300" y2="924"/>
      <line x1="512" y1="100" x2="512" y2="924"/>
      <line x1="724" y1="100" x2="724" y2="924"/>
    </g>

    <!-- Área bajo la curva -->
    <path d="M100 560 H330 L388 470 L452 735 L540 290 L612 640 L660 520 L700 560 H924 V924 H100 Z"
          fill="url(#area)"/>

    <!-- Halo + trazo del pulso -->
    <path d="M150 560 H330 L388 470 L452 735 L540 290 L612 640 L660 520 L700 560 H874"
          fill="none" stroke="url(#pulse)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.55" filter="url(#glow)"/>
    <path d="M150 560 H330 L388 470 L452 735 L540 290 L612 640 L660 520 L700 560 H874"
          fill="none" stroke="url(#pulse)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Brillo superior -->
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>

  <!-- Borde fino -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
</svg>
